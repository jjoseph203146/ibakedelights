<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<script src="./products.js"></script>
<style>
body{margin:0;background:#FFF9F5;font-family:'Figtree',sans-serif;color:#332326;-webkit-font-smoothing:antialiased}
a{color:#8E2449}a:hover{color:#701A39}
:focus-visible{outline:3px solid #8E2449;outline-offset:3px}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
</style>
</helmet>
<div data-screen-label="Menu" style="min-height:100vh;background:#FFF9F5">
<dc-import name="SiteHeader" active="menu" hint-size="100%,122px"></dc-import>
<main>
<section aria-labelledby="m-h" style="background:#FCEEF2;border-bottom:1px solid #E9C6D0">
<div style="max-width:1240px;margin:0 auto;padding:clamp(40px,6vw,72px) clamp(16px,4vw,40px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:32px;align-items:end">
<div style="display:flex;flex-direction:column;gap:14px">
<p style="margin:0;font-size:14px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8E2449">The menu</p>
<h1 id="m-h" style="font-family:'Young Serif',serif;font-weight:400;font-size:clamp(40px,5vw,58px);line-height:1.05;margin:0">Cupcakes, cakes &amp; cheesecakes</h1>
<p style="margin:0;font-size:18px;line-height:1.6;color:#332326;max-width:560px">Pick a dessert and select <b>Order on Square</b> to complete checkout. Cupcakes are sold by the dozen.</p>
</div>
<div style="display:flex;flex-direction:column;gap:10px;background:#FFFEFC;border:1px solid #E9C6D0;border-radius:6px;padding:20px 22px">
<span style="font-weight:800;font-size:16px">Need something for an event?</span>
<span style="font-size:15px;line-height:1.55;color:#735F64">Larger quantities and custom requests go through our event inquiry — not the online store.</span>
<a href="Events.dc.html#inquiry" style="align-self:flex-start;background:#332326;color:#fff;font-weight:800;font-size:15px;padding:12px 20px;border-radius:4px;text-decoration:none;margin-top:4px" style-hover="background:#1F1517;color:#fff">Request an Event Quote</a>
</div>
</div>
</section>
<section aria-label="All products" style="max-width:1240px;margin:0 auto;padding:clamp(36px,5vw,56px) clamp(16px,4vw,40px) clamp(56px,7vw,96px)">
<dc-import name="ProductCatalog" read-hash="{{ true }}" hint-size="100%,2400px"></dc-import>
</section>
</main>
<dc-import name="SiteFooter" hint-size="100%,300px"></dc-import>
</div>
</x-dc>
</body>
</html>
